name: Design System update

on:
  repository_dispatch:
    types: [design-system-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Design System release tag"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned release
        env:
          GH_TOKEN: ${{ secrets.GLU_DESIGN_SYSTEM_READ_TOKEN }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          rm -rf /tmp/design-system
          mkdir -p /tmp/design-system
          gh release download "$VERSION"             --repo Glucontinuum/glucontinuum-design-system             --pattern "glucontinuum-design-system-*.tar.gz"             --dir /tmp/design-system

      - name: Apply generated Web and brand snapshot
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          archive="$(find /tmp/design-system -maxdepth 1 -name 'glucontinuum-design-system-*.tar.gz' -print -quit)"
          test -n "$archive"
          rm -rf vendor/glucontinuum-design-system
          mkdir -p vendor/glucontinuum-design-system
          tar -xzf "$archive" -C vendor/glucontinuum-design-system
          test -f vendor/glucontinuum-design-system/web/tokens.css
          test -f vendor/glucontinuum-design-system/brand/glucontinuum-mark-app.svg
          test -f vendor/glucontinuum-design-system/brand/manifest.json
          cp vendor/glucontinuum-design-system/web/tokens.css src/design-system/tokens.css
          cp vendor/glucontinuum-design-system/brand/glucontinuum-mark-app.svg public/favicon.svg
          cp vendor/glucontinuum-design-system/brand/manifest.json design-system/brand-manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const tokensPath = 'src/design-system/tokens.css';
          let css = readFileSync(tokensPath, 'utf8');
          css = css.replace(
            /^\/\/ (Generated by scripts\/generate-tokens\.mjs\. Do not edit\.)\r?\n/,
            '/* $1 */\n'
          );
          if (/^\/\//m.test(css)) {
            throw new Error('Design System CSS contains an invalid JavaScript-style comment.');
          }
          writeFileSync(tokensPath, css);

          const manifest = JSON.parse(
            readFileSync('vendor/glucontinuum-design-system/release-manifest.json', 'utf8')
          );
          const version = {
            name: manifest.name,
            version: manifest.version,
            sourceCommit: manifest.sourceCommit,
            artifact: `glucontinuum-design-system-${manifest.version}.tar.gz`,
            updatedBy: 'design-system-update-workflow',
            notes: 'Pinned snapshot generated from the published Design System release.'
          };
          writeFileSync('design-system/version.json', JSON.stringify(version, null, 2) + '\\n');
          NODE

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/design-system-update
          commit-message: "chore: update Glucontinuum Design System"
          title: "chore: update Glucontinuum Design System"
          body: "Updates the pinned Design System snapshot and generated Web tokens. CI validates the result."
